# Single-VPS overlay for docker-compose.prod.yml: builds the images on the server, adds photo storage (SeaweedFS)
# and one gateway that serves everything under a single address, so the server's own nginx only ends TLS and
# proxies to 127.0.0.1:${GATEWAY_PORT}:
#   /      web        /api   API        /auth   Keycloak        /<S3_BUCKET>   photos (presigned S3 links)
# Run it through infra/scripts/deploy.sh (see infra/DEPLOY-VPS.md). Needs Docker Compose 2.24 or later (!reset).

services:
  keycloak:
    environment:
      # Served under /auth on the shared address; KEYCLOAK_PUBLIC_URL (KC_HOSTNAME) ends in /auth too.
      KC_HTTP_RELATIVE_PATH: /auth
    ports: !reset []
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    ports: !reset []
    depends_on:
      storage:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # The web app calls ${VITE_API_URL}/api, so the shared address is the API address.
        VITE_API_URL: ${WEB_PUBLIC_URL}
        VITE_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_URL}
    ports: !reset []

  storage:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    # The S3 account is S3_ACCESS_KEY / S3_SECRET_KEY, written to the config file on each start.
    # Volumes are sized from the free disk space (-volume.max=0). The API creates the bucket on startup.
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        printf '{"identities":[{"name":"edm","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.config=/tmp/s3.json \
          -volume.max=0 -master.volumeSizeLimitMB=1024 -master.volumePreallocate=false
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - storage-data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://localhost:9333/cluster/status && wget -q -O /dev/null http://localhost:8333/status'
        ]
      interval: 10s
      timeout: 5s
      retries: 30

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      S3_BUCKET: ${S3_BUCKET:-edm-attachments}
      # Only ${S3_*} is filled in; nginx's own $variables stay as they are.
      NGINX_ENVSUBST_FILTER: ^S3_
    volumes:
      - ./nginx/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - '127.0.0.1:${GATEWAY_PORT:-8090}:80'

volumes:
  storage-data:
