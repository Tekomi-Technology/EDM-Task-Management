# What the API needs on a developer machine: database, Redis and photo storage (the API and web run with
# `pnpm dev`). From the repository root: `pnpm services:up`. Host ports are offset (55432, 56379, 59000) to avoid
# clashing with services already running on the machine.
name: edm

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: edm
      POSTGRES_PASSWORD: edm_dev_password
      POSTGRES_DB: edm
    ports:
      - '55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U edm -d edm']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - '56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for photos. Public MinIO images are no longer published, so local
  # development uses SeaweedFS; the API only speaks the S3 protocol and works with MinIO or any S3 in production.
  # The API creates the bucket on startup.
  storage:
    image: chrislusf/seaweedfs:3.80
    # Small volumes and a generous volume count: each bucket reserves several volumes when first written to.
    command: >
      server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.config=/etc/seaweedfs/s3.json
      -volume.max=100 -master.volumeSizeLimitMB=128 -master.volumePreallocate=false
    ports:
      - '59000:8333'
    volumes:
      - storage-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://localhost:9333/cluster/status && wget -q -O /dev/null http://localhost:8333/status'
        ]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  storage-data:
